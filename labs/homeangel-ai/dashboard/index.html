<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeAngel AI Events</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101216;
      --panel: #191d24;
      --panel-2: #202631;
      --text: #f4f6f8;
      --muted: #a9b2bf;
      --border: #333b49;
      --green: #2fbf71;
      --amber: #e4aa38;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(980px, 100vw);
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      white-space: nowrap;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric,
    .empty,
    table {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .metric {
      padding: 12px;
      min-height: 74px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric strong {
      font-size: 24px;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      background: var(--panel-2);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #0c1118;
      background: var(--green);
      white-space: nowrap;
    }

    .pill.fall {
      background: var(--red);
      color: #fff;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 720px) {
      main {
        padding: 14px;
      }

      header,
      .summary {
        display: block;
      }

      .metric {
        margin-bottom: 10px;
      }

      .status {
        margin-top: 6px;
      }

      th:nth-child(4),
      td:nth-child(4) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>HomeAngel AI Event Tracker</h1>
      <div class="status" id="status">Waiting for events.log</div>
    </header>

    <section class="summary" aria-label="Event summary">
      <div class="metric">
        <span>Total events</span>
        <strong id="total">0</strong>
      </div>
      <div class="metric">
        <span>Last zone</span>
        <strong id="zone">-</strong>
      </div>
      <div class="metric">
        <span>Last confidence</span>
        <strong id="confidence">-</strong>
      </div>
    </section>

    <section id="empty" class="empty">No fall events received.</section>
    <table id="events" hidden>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Event</th>
          <th>Zone</th>
          <th>Track</th>
          <th>Confidence</th>
          <th>State</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const totalEl = document.getElementById("total");
    const zoneEl = document.getElementById("zone");
    const confidenceEl = document.getElementById("confidence");
    const emptyEl = document.getElementById("empty");
    const tableEl = document.getElementById("events");
    const rowsEl = document.getElementById("rows");

    function formatTimestamp(value) {
      const seconds = Number(value);
      if (!Number.isFinite(seconds)) return "-";
      return `${seconds.toFixed(2)}s`;
    }

    function render(events) {
      totalEl.textContent = events.length;
      const latest = events[events.length - 1];
      zoneEl.textContent = latest ? latest.zone_label || "-" : "-";
      confidenceEl.textContent = latest && Number.isFinite(Number(latest.confidence))
        ? `${Math.round(Number(latest.confidence) * 100)}%`
        : "-";

      emptyEl.hidden = events.length > 0;
      tableEl.hidden = events.length === 0;
      rowsEl.replaceChildren();

      events.slice().reverse().forEach((event) => {
        const row = document.createElement("tr");
        const confidence = Number(event.confidence);
        row.innerHTML = `
          <td>${formatTimestamp(event.timestamp_s)}</td>
          <td>${event.event || "-"}</td>
          <td>${event.zone_label || "-"}</td>
          <td>${event.track_id ?? "-"}</td>
          <td>${Number.isFinite(confidence) ? `${Math.round(confidence * 100)}%` : "-"}</td>
          <td><span class="pill fall">FALL</span></td>
        `;
        rowsEl.appendChild(row);
      });
    }

    async function refresh() {
      try {
        const response = await fetch("../events.log", { cache: "no-store" });
        if (response.status === 404) {
          statusEl.textContent = "events.log not created yet";
          render([]);
          return;
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        const events = text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            try {
              return JSON.parse(line);
            } catch (_err) {
              return null;
            }
          })
          .filter(Boolean);
        statusEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;
        render(events);
      } catch (err) {
        statusEl.textContent = `Unable to read events.log: ${err.message}`;
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
