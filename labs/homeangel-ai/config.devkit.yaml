device_id: modalix-hallway-01
zone_label: bedroom

model:
  path: /workspace/labs/homeangel-ai/models/yolo26m-pose-int8-b1.tar.gz

streams:
  - rtsp://192.168.1.10:8554/src1

input:
  codec: h264
  tcp: true
  latency_ms: 100
  max_width: 1920
  max_height: 1080
  source_width: 1280
  source_height: 720
  source_fps: 30

runtime:
  profile: true
  warmup_frames: 10

inference:
  frames: 0
  max_inflight_per_stream: 4
  max_inflight_total: 16
  min_score: 0.50
  nms_iou: 0.60
  max_poses: 20

tracking:
  iou_threshold: 0.30
  max_missing_frames: 15

fall_velocity_threshold: 0.45
angular_velocity_threshold_deg_s: 90
angle_threshold_deg: 60
confirm_seconds: 2.0
stillness_threshold: 0.06
velocity_window_seconds: 0.75
stillness_window_seconds: 0.80
down_centroid_y_fraction: 0.55
recovery_angle_deg: 35
min_present_frames: 3

output:
  insight:
    host: 192.168.1.10
    video_port_base: 9000
    metadata_port_base: 9100
    viewer_url: https://192.168.1.10:8081/static/viewer.html?mode=light&src=0&max_channels=4
  video_enabled: true
  events_log: /workspace/labs/homeangel-ai/events.log
  telemetry_json: /workspace/labs/homeangel-ai/telemetry.json
  telemetry_history_limit: 150

webhook_url: null

alerts:
  telegram:
    enabled: false
    token_env: HOMEANGEL_TELEGRAM_BOT_TOKEN
    routes: null

vlm:
  enabled: false
  host: 127.0.0.1
  port: 9998
  models: Gemma-4-E4B-it,Qwen3-VL-4B-Instruct-GPTQ-a16w4
  model_paths: Gemma-4-E4B-it=/media/nvme/llima/models/Gemma-4-E4B-it,Qwen3-VL-4B-Instruct-GPTQ-a16w4=/media/nvme/llima/models/Qwen3-VL-4B-Instruct-GPTQ-a16w4
  max_tokens: 96
  timeout_seconds: 20
  jpeg_quality: 78
  crop_padding: 0.20
  system_prompt: "You are HomeAngel's local safety analyst. Describe only visible safety context. Do not identify the person."
  user_prompt: "Briefly describe whether the person appears to be on the floor, motionless, getting up, sitting normally, or needing help."
